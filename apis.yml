description: >-
  Selective Insurance Group, Inc. (NASDAQ: SIGI) is a Branchville, New Jersey holding
  company whose insurance subsidiaries underwrite standard commercial lines, standard
  personal lines, and excess and surplus lines property and casualty insurance, plus
  flood insurance written through the National Flood Insurance Program's Write Your Own
  program. Coverage is distributed exclusively through independent insurance agents and
  brokers across the Eastern and Midwestern United States. Selective operates customer
  and agent self-service portals (MySelective, and the agent portal at
  customer1.selectiveinsurance.com) and supports policy, billing and claims download into
  agency management systems, but publishes no public developer program, API documentation,
  or machine-readable API contract as of this profile.
